name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    # Private repositories use local checks unless a maintainer starts CI explicitly.
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false
    runs-on: macos-15
    env:
      RINGONOMITV_CACHE_ROOT: ${{ github.workspace }}/.cache
      RINGONOMITV_BUILD_TMPDIR: ${{ github.workspace }}/.tmp
    steps:
      - name: ソースを取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Xcodeを選択
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '16.4'

      - name: Swiftテストを実行
        run: ./test.sh

      - name: 通信契約チェックを実行
        run: xcrun swift run --package-path . --scratch-path .build --cache-path "$RINGONOMITV_CACHE_ROOT/swiftpm" RingonomiContractCheck
